[project]
name = "keyboard-stl-generator"
version = "0.1.0"
description = "Generate OpenSCAD/STL files for custom mechanical keyboard plates and cases"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.14,<4.0"
dependencies = [
    "setuptools (>=59.6.0)",
    "solidpython (>=1.1.3)",
    "json5 (>=0.14.0,<0.15.0)",
    "jsonschema (>=4.26.0,<5.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
mypy = "^1.11"
ruff = "^0.14"
pylint = "^4.0"
black = "^25.0"

[tool.ruff]
line-length = 150
extend-exclude = ["stubs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "RUF", "LOG", "G"]
# Design metrics (PL*) are left to pylint, which has the thresholds set in
# .pylintrc. solidpython is designed to be star-imported: cube(), up(), union()
# and the rest of the geometry builders only reach the namespace that way.
ignore = [
    "F403",
    "F405",
    "G004",
    # Debt. Each needs a judgement call rather than a rewrite; see .pylintrc for
    # the design-metric equivalents.
    "ARG002",
    "B008",
    "B905",
    "E722",
    "F841",
    "PLC0206",
    "RET504",
    "RUF012",
    "RUF059",
    "SIM115",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
# solidpython ships no type information. The local stubs in stubs/solid type its
# geometry builders (union(), cube(), up(), ...) as returning OpenSCADObject so a
# `solid = union()` local isn't narrowed to the builder's own class, which would
# otherwise flag every later reassignment to a base OpenSCADObject.
mypy_path = "stubs"
files = ["."]
exclude = ["tests/"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
