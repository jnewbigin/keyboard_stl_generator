[project]
name = "keyboard-stl-generator"
version = "0.1.0"
description = "Generate OpenSCAD/STL files for custom mechanical keyboard plates and cases"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.8,<4.0"
dependencies = [
    "setuptools (>=59.6.0)",
    "solidpython (>=1.1.3)",
    "json5 (>=0.14.0,<0.15.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
